<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 0 16px;
    box-sizing: border-box;
  }
  main {
    max-width: 32rem;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 0.75rem;
  }
  p {
    line-height: 1.5;
    margin: 0 0 1rem;
  }
  .uri {
    font-size: 0.9rem;
    opacity: 0.7;
    word-break: break-all;
  }
  .reload {
    display: inline-block;
    padding: 0.5rem 1.25rem;
    border-radius: 6px;
    background: #3584e4;
    color: #ffffff;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>A página falhou</h1>
  <p>{reason}</p>
  <p class="uri">{uri}</p>
  <a class="reload" href="{uri}">Recarregar</a>
</main>
</body>
</html>
