[package]
name = "astra-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Astra Browser: navegador web desktop minimalista em Rust com GTK4 e WebKitGTK 6.0"
license = "GPL-3.0-only"
repository = "https://github.com/aleksanderpalamar/astra-browser"
readme = "README.md"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
percent-encoding = "2.3"
psl = "2.1"
serde_json = "1.0"
url = "2.5"
webkit6 = "0.6"

[package.metadata.deb]
maintainer = "Aleksander Palamar <apalamardev@gmail.com>"
copyright = "2026, Aleksander Palamar <apalamardev@gmail.com>"
section = "web"
priority = "optional"
extended-description = "Navegador web minimalista com interface nativa GTK4 e renderização pelo WebKitGTK 6.0, com abas, favoritos, histórico, downloads, modo privado, bloqueador de anúncios e ferramentas do desenvolvedor."
depends = "$auto, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav"
license-file = ["LICENSE", "0"]

assets = [
    ["target/release/astra-browser", "usr/bin/", "755"],
    [
        "data/io.github.aleksanderpalamar.AstraBrowser.desktop",
        "usr/share/applications/",
        "644"
    ],
    [
        "data/icons/src/astra.svg",
        "usr/share/icons/hicolor/scalable/apps/io.github.aleksanderpalamar.AstraBrowser.svg",
        "644"
    ],
    [
        "data/icons/src/astra-symbolic.svg",
        "usr/share/icons/hicolor/symbolic/apps/io.github.aleksanderpalamar.AstraBrowser-symbolic.svg",
        "644"
    ],
    [
        "data/icons/hicolor/**/*.png",
        "usr/share/icons/hicolor/",
        "644"
    ]
]

[package.metadata.generate-rpm]
release = "1"
auto-req = "disabled"

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.10"
"webkitgtk6.0" = "*"
gstreamer1-plugins-good = "*"
gstreamer1-plugins-bad-free = "*"
gstreamer1-plugin-libav = "*"

[[package.metadata.generate-rpm.assets]]
source = "target/release/astra-browser"
dest = "/usr/bin/astra-browser"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "data/io.github.aleksanderpalamar.AstraBrowser.desktop"
dest = "/usr/share/applications/io.github.aleksanderpalamar.AstraBrowser.desktop"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "data/icons/src/astra.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/io.github.aleksanderpalamar.AstraBrowser.svg"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "data/icons/src/astra-symbolic.svg"
dest = "/usr/share/icons/hicolor/symbolic/apps/io.github.aleksanderpalamar.AstraBrowser-symbolic.svg"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "data/icons/hicolor/**/*.png"
dest = "/usr/share/icons/hicolor/"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/astra-browser/LICENSE"
mode = "0644"
