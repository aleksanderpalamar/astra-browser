name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/pr-quality-gate.yml

  arch:
    name: Arch Linux package
    needs: quality
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm \
            git \
            rustup \
            webkitgtk-6.0 \
            gtk4 \
            gst-plugins-good \
            gst-plugins-bad \
            gst-libav

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply version from tag
        run: ./scripts/apply-tag-version.sh "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Create source tarball
        run: |
          snapshot="$(git -c user.name=ci -c user.email=ci@localhost stash create)"
          git archive \
            --format=tar.gz \
            --prefix="astra-browser-$ARCH_VERSION/" \
            --output="packaging/arch/astra-browser-$ARCH_VERSION.tar.gz" \
            "${snapshot:-HEAD}"

      - name: Prepare build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder rustup default stable

      - name: Build Arch package
        run: |
          cd packaging/arch
          runuser -u builder -- env HOME=/home/builder makepkg -sf --noconfirm

      - name: Install and check Arch package
        run: |
          pacman -U --noconfirm "packaging/arch/astra-browser-${ARCH_VERSION}-1-x86_64.pkg.tar.zst"
          test "$(pacman -Q astra-browser)" = "astra-browser ${ARCH_VERSION}-1"

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst


  deb:
    name: Debian package
    needs: quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply version from tag
        run: ./scripts/apply-tag-version.sh "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Install and check Debian package
        run: |
          sudo apt-get install -y "./target/debian/astra-browser_${PACKAGE_VERSION}-1_amd64.deb"
          test "$(dpkg-query -W -f='${Version}' astra-browser)" = "${PACKAGE_VERSION}-1"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: target/debian/*.deb


  rpm:
    name: RPM package
    needs: quality
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            gcc \
            gcc-c++ \
            pkgconf-pkg-config \
            gtk4-devel \
            webkitgtk6.0-devel \
            rust \
            cargo

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply version from tag
        run: ./scripts/apply-tag-version.sh "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binary
        run: strip target/release/astra-browser

      - name: Build RPM package
        run: cargo generate-rpm --set-metadata "version = \"$PACKAGE_VERSION\""

      - name: Install and check RPM package
        run: |
          dnf install -y "./target/generate-rpm/astra-browser-${PACKAGE_VERSION}-1.x86_64.rpm"
          test "$(rpm -q --queryformat '%{VERSION}-%{RELEASE}' astra-browser)" = "${PACKAGE_VERSION}-1"

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: target/generate-rpm/*.rpm


  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - arch
      - deb
      - rpm

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lah dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Astra Browser ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${prerelease[@]}"