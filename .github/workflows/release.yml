name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm \
            git \
            rustup \
            webkitgtk-6.0 \
            gtk4 \
            gst-plugins-good \
            gst-plugins-bad \
            gst-libav

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder rustup default stable

      - name: Build Arch package
        run: |
          cd packaging/arch
          runuser -u builder -- env HOME=/home/builder makepkg -sf --noconfirm

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst


  deb:
    name: Debian package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: target/debian/*.deb


  rpm:
    name: RPM package
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            gcc \
            gcc-c++ \
            pkgconf-pkg-config \
            gtk4-devel \
            webkitgtk6.0-devel \
            rust \
            cargo

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binary
        run: strip target/release/astra-browser

      - name: Build RPM package
        run: cargo generate-rpm

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: target/generate-rpm/*.rpm


  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - arch
      - deb
      - rpm

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lah dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Astra Browser ${GITHUB_REF_NAME}" \
            --generate-notes